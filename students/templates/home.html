<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
</head>
<body>
    <h1>Student Management System</h1>

    <table border="1" cellpadding="8">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Created At</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.course }}</td>
            <td>{{ student.created_at }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No students found</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
